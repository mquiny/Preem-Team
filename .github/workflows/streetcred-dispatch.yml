name: Apply StreetCred snapshot from bot

on:
  repository_dispatch:
    types: [streetcred_snapshot]

permissions:
  contents: write

jobs:
  apply-streetcred:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply StreetCred payload
        env:
          STREETCRED_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/apply-streetcred.js

      - name: Commit and push
        run: |
          git config user.name "Preem Team Bot"
          git config user.email "actions@github.com"
          git add docs/team/streetcred.md
          if git diff --cached --quiet; then
            echo "No StreetCred changes to commit"
            exit 0
          fi
          git commit -m "Sync StreetCred leaderboard"
          git push
