name: Apply content removal from bot

on:
  repository_dispatch:
    types: [content_removed]

permissions:
  contents: write

jobs:
  apply-removal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply removal and push (retries on push race)
        env:
          REMOVAL_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "Preem Team Bot"
          git config user.email "actions@github.com"

          # Same race as the other *-dispatch.yml workflows: re-run the
          # (idempotent) script fresh against latest main on a push race
          # rather than rebasing the old commit.
          for attempt in 1 2 3 4 5; do
            node scripts/apply-removal.js

            git add docs/showcase/index.md docs/showcase/archive.md docs/showcase/assets/ docs/feedback/index.md
            if git diff --cached --quiet; then
              echo "No removal changes to commit (probably already removed or never featured)"
              exit 0
            fi

            git commit -m "Remove featured content: ${{ github.event.client_payload.submission_id }}"

            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi

            echo "Push failed on attempt $attempt -- another dispatch landed first, resetting to latest main and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done

          echo "::error::Failed to push removal after 5 attempts (submission ${{ github.event.client_payload.submission_id }})"
          exit 1
