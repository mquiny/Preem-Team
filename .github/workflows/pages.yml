name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with the changelog-dispatch workflow's own token doesn't
  # trigger the `push` event above (GitHub suppresses that on purpose, to
  # avoid workflows recursively triggering each other) — so listen for that
  # workflow finishing instead, and rebuild if it did.
  workflow_run:
    workflows: ["Apply changelog from bot"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only proceed for a workflow_run if the changelog job actually succeeded
    # (workflow_run also fires on failure/cancellation) — push/workflow_dispatch
    # have no workflow_run conclusion to check, so let those through as-is.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so git-revision-date-localized-plugin gets real dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
