site_name: Preem Team Cyberpunk Collection
site_description: >-
  Preem Team — a curated, staff-maintained Cyberpunk 2077 mod collection.
  Docs, guides, changelog, and support hub.
site_author: Preem Team Crew
site_url: https://preemteam.com/

repo_url: https://github.com/mquiny/Preem-Team
repo_name: mquiny/Preem-Team
edit_uri: edit/main/docs/

copyright: >-
  Preem Team is a fan-made mod collection. Not affiliated with CD PROJEKT RED.
  Cyberpunk 2077 and all related trademarks are property of their respective owners.

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
    admonition:
      note: material/chip
      tip: material/lightning-bolt
      warning: material/alert-decagram
      danger: material/skull-crossbones
      example: material/console-network
  font:
    text: Rajdhani
    code: JetBrains Mono
  # Dark ("slate") only, deliberately. The whole site's identity (neon
  # accents, dark Night City photography, terminal-style text) is designed
  # and tested exclusively against this scheme. A "(prefers-color-scheme)"
  # media-matched palette here would let Material auto-pick light mode for
  # some visitors, cache that choice in their browser's localStorage
  # (__palette) on first visit, and never re-check it again -- with no
  # toggle in the header (removed further down) to fix a stale/wrong pick,
  # that leaves them permanently stuck on an unstyled, low-contrast light
  # render of a page meant to be dark. Forcing a single scheme with no
  # `media` key sidesteps that whole failure mode for every future visitor.
  palette:
    - scheme: slate
      primary: black
      accent: pink
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

# The ?v=N on every custom file below is a manual cache-buster. MkDocs
# doesn't hash/fingerprint extra_css/extra_javascript filenames itself
# (only its own built-in theme assets get that), so browsers can and do
# keep serving a stale cached copy of one of these indefinitely after a
# site update -- exactly what happened when the Features page's popup
# pagination shipped but a returning visitor's browser kept the old
# features.js/features.css, producing a broken hybrid of new markup +
# old script. Bump the number on a specific file whenever you edit it
# (no need to touch the others) to force browsers to fetch it fresh.
extra_css:
  - stylesheets/extra.css?v=1
  - stylesheets/backgrounds.css?v=1
  - stylesheets/steps.css?v=1
  - stylesheets/features.css?v=2
  - stylesheets/changelog.css?v=1
  - stylesheets/showcase.css?v=1
  - stylesheets/issue-viewer.css?v=1
  - stylesheets/streetcred.css?v=1
  - stylesheets/spawn-commands.css?v=1

nav:
  - Home: index.md
  - Features: features/index.md
  - Commands: commands/index.md
  - Installation:
      - installation/index.md
      - Installing the CPE Collections: installation/cpe_collection.md
  - Guides:
      - guides/index.md
      - Clean Install: guides/clean_install.md
      - First Boot: guides/first_time_boot.md
      - CET Setup: guides/cet_setup.md
  - Changelog:
      - Current Revision: changelog/index.md
      - Archived Revisions: changelog/archive.md
  - FAQ: faq/index.md
  - Showcase:
      - showcase/index.md
      - Archive: showcase/archive.md
  - Troubleshooting:
      - troubleshooting/index.md
      - Common Problems: troubleshooting/common_problems.md
      - How to Bisect: troubleshooting/how_to_bisect.md
      - Issue Viewer: troubleshooting/issue_viewer.md
      - Issue Archive: troubleshooting/issue_archive.md
      - Quick Commands: troubleshooting/quick_commands.md
  - Meet the Team:
      - team/index.md
      - StreetCred Leaderboard: team/streetcred.md

plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - pt-changelog-card-thumb
        - pt-feature-modal-img
  - tags
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

hooks:
  - scripts/pt_mdx_block_html.py

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: "#"
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/QvYzYZFmnE
      name: Preem Team Discord
    - icon: fontawesome/brands/github
      link: https://github.com/mquiny/Preem-Team
      name: Preem Team on GitHub
  generator: false

extra_javascript:
  - javascripts/backgrounds.js?v=1
  - javascripts/nav-autohide.js?v=1
  - javascripts/steps.js?v=1
  - javascripts/changelog.js?v=1
  - javascripts/features.js?v=2
  - javascripts/issue-viewer.js?v=1
  - javascripts/streetcred.js?v=1
  - javascripts/spawn-commands.js?v=1
